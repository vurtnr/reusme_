/* ================= 3D 文字 sprite ================= */
function textSprite(text, color = '#ffffff') {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 200;
  const g = cv.getContext('2d');
  let size = 96;
  g.font = `800 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  const w = g.measureText(text).width;
  if (w > 960) {   // 超宽自动缩字号,防止两端被裁
    size = Math.floor(size * 960 / w);
    g.font = `800 ${size}px "PingFang SC", "Microsoft YaHei", sans-serif`;
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 28;
  g.fillStyle = color;
  g.fillText(text, 512, 100);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.scale.set(11, 2.15, 1);
  return sp;
}

/* ================= 卷轴(挂轴,自上而下展开) ================= */
function wrapLines(g, text, maxW) {
  const lines = []; let line = '';
  for (const ch of text) {
    if (line && g.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}

function makeScroll(seg, idx) {
  const hex = '#' + seg.c.toString(16).padStart(6, '0');
  const rgba = (c, a) => `rgba(${c >> 16 & 255},${c >> 8 & 255},${c & 255},${a})`;
  const mix = (base, c, t) => {   // 卷面底色向类型色微调
    const n = parseInt(base.slice(1), 16);
    const ch = i => Math.round((n >> i & 255) * (1 - t) + (c >> i & 255) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  };
  // 四类卷轴形制:1H 档案 / 亮点嘉奖 / 不足修缮 / 2H 蓝图
  const kind = seg.k.includes('· 亮点') ? 'hi'
             : seg.k.includes('· 不足') ? 'lo'
             : seg.k.startsWith('四') ? 'p2h' : 'p1h';
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 1152;
  const x = cv.getContext('2d');
  const font = (w, s) => `${w} ${s}px "PingFang SC", "Microsoft YaHei", sans-serif`;

  // 卷面:深色渐变,按类型着色
  const grad = x.createLinearGradient(0, 0, 0, 1152);
  grad.addColorStop(0, mix('#101a2c', seg.c, .18));
  grad.addColorStop(1, mix('#090e18', seg.c, .10));
  x.fillStyle = grad; x.fillRect(0, 0, 1024, 1152);

  // 边框:档案单框 / 嘉奖双框 / 修缮角括号 / 蓝图对位刻度
  x.strokeStyle = rgba(seg.c, .45);
  if (kind === 'lo') {
    x.lineWidth = 5; x.beginPath();
    for (const [cx, cy, dx, dy] of [[30, 30, 1, 1], [994, 30, -1, 1], [30, 1122, 1, -1], [994, 1122, -1, -1]]) {
      x.moveTo(cx + 90 * dx, cy); x.lineTo(cx, cy); x.lineTo(cx, cy + 90 * dy);
    }
    x.stroke();
  } else {
    x.lineWidth = kind === 'hi' ? 5 : 4;
    x.strokeRect(30, 30, 964, 1092);
    if (kind === 'hi') { x.lineWidth = 2; x.strokeRect(48, 48, 928, 1056); }
    if (kind === 'p2h') {
      x.lineWidth = 3; x.beginPath();
      for (const [cx, cy, dx, dy] of [[30, 30, -1, -1], [994, 30, 1, -1], [30, 1122, -1, 1], [994, 1122, 1, 1]]) {
        x.moveTo(cx + 26 * dx, cy); x.lineTo(cx + 6 * dx, cy);
        x.moveTo(cx, cy + 26 * dy); x.lineTo(cx, cy + 6 * dy);
      }
      x.stroke();
    }
  }

  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = hex; x.font = font(600, 34);
  x.fillText(kind === 'hi' ? `◆ ${seg.k} ◆` : seg.k, 512, 118);

  let size = 70;
  x.font = font(800, size);
  const tw = x.measureText(seg.t).width;
  if (tw > 880) { size = Math.floor(size * 880 / tw); x.font = font(800, size); }
  x.fillStyle = '#f4f7fa';
  x.fillText(seg.t, 512, 228);

  // 分隔:档案实线 / 嘉奖菱花 / 修缮虚线 / 蓝图点线
  x.fillStyle = hex;
  if (kind === 'lo') { for (let i = 0; i < 6; i++) x.fillRect(430 + i * 29, 294, 17, 4); }
  else if (kind === 'p2h') { for (let i = 0; i < 9; i++) { x.beginPath(); x.arc(448 + i * 16, 296, 2.6, 0, 7); x.fill(); } }
  else {
    x.fillRect(432, 292, 160, 5);
    if (kind === 'hi') { x.save(); x.translate(512, 294); x.rotate(Math.PI / 4); x.fillRect(-7, -7, 14, 14); x.restore(); }
  }

  x.fillStyle = '#c4d2e0'; x.font = font(400, 37);
  const lines = wrapLines(x, seg.d, 850);
  lines.forEach((ln, li) => x.fillText(ln, 512, 385 + li * 64));

  // 标签:描线小印式排列,自动换行
  x.font = font(500, 30);
  let tagY = 385 + lines.length * 64 + 78, row = [], rowW = 0;
  const drawRow = () => {
    let px = 512 - rowW / 2 + 11;
    for (const [txt, w] of row) {
      if (kind === 'hi') {              // 嘉奖:实心色章
        x.fillStyle = rgba(seg.c, .24);
        x.fillRect(px, tagY - 26, w, 52);
      } else if (kind === 'p2h' && x.roundRect) {   // 蓝图:圆角胶囊
        x.strokeStyle = rgba(seg.c, .55); x.lineWidth = 2;
        x.beginPath(); x.roundRect(px, tagY - 26, w, 52, 26); x.stroke();
      } else {                          // 档案描线 / 修缮虚线
        x.strokeStyle = kind === 'lo' ? rgba(seg.c, .55) : 'rgba(255,255,255,.35)';
        x.lineWidth = 2;
        if (kind === 'lo') x.setLineDash([8, 6]);
        x.strokeRect(px, tagY - 26, w, 52);
        x.setLineDash([]);
      }
      x.fillStyle = kind === 'hi' ? '#ffffff' : '#e5edf5';
      x.fillText(txt, px + w / 2, tagY);
      px += w + 22;
    }
  };
  for (const txt of seg.tags || []) {
    const w = x.measureText(txt).width + 36;
    if (rowW + w > 850 && row.length) { drawRow(); tagY += 72; row = []; rowW = 0; }
    row.push([txt, w]); rowW += w + 22;
  }
  if (row.length) drawRow();

  const W = 7.2, H = 8.1;
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const paperGeo = new THREE.PlaneGeometry(W, H);
  paperGeo.translate(0, -H / 2, 0);   // 顶部为轴,卷面向下展开
  const paper = new THREE.Mesh(paperGeo,
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
  paper.position.y = -.34;
  const g = new THREE.Group();
  const rollerM = mat(0xfbbf24, 0xfbbf24, .9);
  const topR = cyl(.24, .24, W + .9, rollerM); topR.rotation.z = Math.PI / 2;
  const botR = cyl(.3, .3, W + .9, rollerM); botR.rotation.z = Math.PI / 2;
  g.add(topR, paper, botR);
  g.visible = false;

  const s = { open: 0, v: 0 };
  return { group: g, tick(t, dt) {
    // 视角由远及近渐开,滚过站点合拢
    const target = reduceMotion
      ? (Math.abs(viewF - idx) < 1 ? 1 : 0)
      : smoothstep((1 - Math.abs(viewF - idx)) / .55);
    // 弹簧阻尼,收放带惯性
    s.v += (target - s.open) * 55 * dt;
    s.v *= Math.exp(-9 * dt);
    s.open += s.v * dt;
    const open = Math.min(Math.max(s.open, 0), 1);
    g.visible = open > .01;
    if (!g.visible) return;
    const oy = Math.max(open, .001);
    paper.scale.y = oy;
    tex.repeat.y = oy;
    tex.offset.y = 1 - oy;
    botR.position.y = -.34 - H * open;
    g.rotation.z = Math.sin(t * .8 + idx) * .025;   // 悬挂轻摆
  } };
}

    return { group: g, tick: t => {
      ring.rotation.z = t * .2;
      orb.scale.setScalar(1 + Math.sin(t * 1.5) * .08);
    } };
  },
};

/* ================= 时间轴铺设 ================= */
// 相机路径控制点(带轻微摆动,避免一条直线太死板)
const pts = [new THREE.Vector3(0, 2, 30)];
for (let i = 0; i < N; i++) {
  const weave = SEGS[i].centered ? 0 : Math.sin(i * 1.3) * 2.5;
  pts.push(new THREE.Vector3(weave, 2 + Math.sin(i * .7) * .5, -i * GAP));
}
pts.push(new THREE.Vector3(0, 2, -(N - 1) * GAP - 35));
const curve = new THREE.CatmullRomCurve3(pts);
curve.arcLengthDivisions = 400;

// 时间轴光轨(沿着路径的一条亮线,把叙事串起来)
{
  const linePts = curve.getPoints(300).map(p => new THREE.Vector3(p.x, -1.6, p.z));
  const rail = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(linePts),
    new THREE.LineBasicMaterial({ color: 0x334a66, transparent: true, opacity: .8 }));
  scene.add(rail);
}

const tickers = [];
const stationSide = [];   // 每站左右侧,用于相机注视偏置

for (let i = 0; i < N; i++) {
  const seg = SEGS[i];
  const centered = !!seg.centered;
  const side = centered ? 0 : (i % 2 ? 1 : -1);
  stationSide.push(side);

  const z = -i * GAP;
  const holder = new THREE.Group();

  if (centered) {
    // 时代之门/年中/终点:门在路径上,主体在门内或旁边
    const gate = builders.gate(seg.c);
    gate.group.position.set(0, 2, z);
    holder.add(gate.group); tickers.push(gate.tick);
    if (seg.build !== 'gate') {
      const main = builders[seg.build](seg.c);
      main.group.position.set(8.5, 0, z);   // 主体靠边,相机穿门不穿模
      holder.add(main.group); tickers.push(main.tick);
    }
    const label = textSprite(seg.t, '#' + seg.c.toString(16).padStart(6, '0'));
    label.position.set(0, 11.5, z);
    holder.add(label);
  } else {
    // 项目站:平台 + 主体 + 标题
    const x = side * 9;
    const plat = cyl(4.2, 4.6, .35, new THREE.MeshStandardMaterial({
      color: 0x0d1420, emissive: seg.c, emissiveIntensity: .12, roughness: .8 }), 40);
    plat.position.set(x, -1.8, z);
    holder.add(plat);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(4.4, .07, 8, 48), mat(seg.c, seg.c, 1));
    rim.rotation.x = Math.PI / 2; rim.position.set(x, -1.6, z);
    holder.add(rim);

    const main = builders[seg.build](seg.c);
    main.group.position.set(x, -1.4, z);
    holder.add(main.group); tickers.push(main.tick);

    const label = textSprite(seg.label || seg.t, '#' + seg.c.toString(16).padStart(6, '0'));
    label.position.set(x, 6.5, z);
    holder.add(label);
  }
  if (i > 0 && !seg.panel) {   // PD 人员卡片与阶段复盘保持原 HUD 文案,不挂卷轴
    const sc = makeScroll(seg, i);
    const scrollX = centered ? -5.2 : -side * 5.2;   // 挂在本站模型的水平镜像侧,靠近中线防遮挡
    sc.group.position.set(scrollX, 7.6, z);
    holder.add(sc.group);
    tickers.push(sc.tick);
  }
  scene.add(holder);
}

// 星空
{
  const n = 1400, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (Math.random() - .5) * 130;
    pos[i * 3 + 1] = (Math.random() - .5) * 70 + 5;
    pos[i * 3 + 2] = 40 - Math.random() * (N * GAP + 100);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xaac4dd, size: .22, sizeAttenuation: true })));
}

/* ================= 滚动驱动 + HUD ================= */
const TIMELINE_PAGES = N + 2, THANKS_PAGES = 2;
document.body.style.height = `${(TIMELINE_PAGES + THANKS_PAGES) * 100}vh`;

const $ = id => document.getElementById(id);
const panel = $('panel'), kicker = $('kicker'), title = $('title'),
      desc = $('desc'), tags = $('tags'), bar = $('bar'),
      hint = $('hint'), again = $('again'), dots = $('dots'),
      cover = $('cover'), hud = $('hud'), thanks = $('thanks'),
      thanksInner = $('thanks-inner'), thanksAgain = $('thanks-again');

// 导航点
const dotBtns = SEGS.map((s, i) => {
  const b = document.createElement('button');
  b.title = s.t;
  b.onclick = () => scrollTo({ top: i / (N - 1) * timelineMaxScroll(), behavior: 'smooth' });
  dots.appendChild(b);
  return b;
});

const timelineMaxScroll = () => (TIMELINE_PAGES - 1) * innerHeight;

let curIdx = -1, panelTimer;
function setSegment(i) {
  if (i === curIdx) return;
  curIdx = i;
  clearTimeout(panelTimer);
  panel.classList.toggle('scroll-mode', i !== 0 && !SEGS[i].panel);
  panel.classList.add('fade');
  panelTimer = setTimeout(() => {
    const s = SEGS[i];
    kicker.textContent = s.k;
    kicker.style.color = '#' + s.c.toString(16).padStart(6, '0');
    title.textContent = s.t;
    desc.textContent = s.d;
    tags.innerHTML = (s.tags || []).map(t => `<span>${t}</span>`).join('');
    again.style.display = i === LAST ? 'inline-block' : 'none';
    panel.classList.remove('fade');
  }, 280);
  dotBtns.forEach((b, j) => b.classList.toggle('on', j === i));
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = value => Math.min(Math.max(value, 0), 1);
const smoothstep = value => {
  const x = clamp01(value);
  return x * x * (3 - 2 * x);
};

let thanksVisible = false;
function setThanksVisible(show) {
  if (show === thanksVisible) return;
  thanksVisible = show;
  thanks.classList.toggle('show', show);
  thanks.setAttribute('aria-hidden', String(!show));
}

function updateThanksTransition(progress) {
  const show = progress > 0;
  const backdrop = reduceMotion ? Number(show) : smoothstep((progress - .08) / .72);
  const content = reduceMotion ? Number(show) : smoothstep((progress - .28) / .55);
  setThanksVisible(show);
  thanks.style.backgroundColor = `rgba(5,7,13,${(.94 * backdrop).toFixed(3)})`;
  thanksInner.style.opacity = content;
  thanksInner.style.transform = `translateY(${Math.round((1 - content) * 48)}px)`;
  hud.style.opacity = 1 - backdrop;
  canvas.style.filter = `brightness(${1 - backdrop * .7}) saturate(${1 - backdrop * .4})`;
  canvas.style.opacity = 1 - backdrop * .3;
}

const restart = () => scrollTo({ top: 0, behavior: 'smooth' });
again.onclick = restart;
thanksAgain.onclick = restart;
$('start').onclick = () => {
  cover.classList.add('off');
};
addEventListener('scroll', () => {
  if (scrollY > 40) { cover.classList.add('off'); hint.style.opacity = 0; }
}, { passive: true });

/* ================= 渲染循环 ================= */
const mouse = { x: 0, y: 0 };
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth - .5) * 2;
  mouse.y = (e.clientY / innerHeight - .5) * 2;
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let smooth = 0, viewF = 0;
const clock = new THREE.Clock();
const lookAhead = new THREE.Vector3();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;

  const target = Math.min(Math.max(scrollY / timelineMaxScroll(), 0), 1);
  const thanksProgress = Math.min(Math.max(
    (scrollY - timelineMaxScroll()) / (THANKS_PAGES * innerHeight), 0), 1);
  updateThanksTransition(thanksProgress);
  smooth += (target - smooth) * (1 - Math.pow(.001, dt));   // 帧率无关阻尼

  // 相机沿路径
  const p = curve.getPointAt(smooth);
  camera.position.set(p.x + mouse.x * .7, p.y - mouse.y * .5, p.z);

  // 注视:路径前方 + 偏向当前站一侧
  const segF = smooth * (N - 1);
  const i0 = Math.min(Math.floor(segF), N - 1);
  const frac = segF - i0;
  const sideX = stationSide[i0] * (1 - frac) + (stationSide[i0 + 1] ?? 0) * frac;
  curve.getPointAt(Math.min(smooth + .035, 1), lookAhead);
  lookAhead.x += sideX * 9 * .42;
  lookAhead.y -= .4;
  camera.lookAt(lookAhead);

  viewF = -lookAhead.z / GAP;

  for (const fn of tickers) fn(t, dt);

  bar.style.width = `${smooth * 100}%`;
  // 文案与“注视点”同步而非相机位置:相机总是看向前方站台,
  // 用 lookAhead 的 z 推算当前看到的站,文字即随视野切换
  const viewIdx = Math.min(Math.max(Math.round(viewF), 0), N - 1);
  setSegment(viewIdx);

  renderer.render(scene, camera);
});
</script>
</body>
</html>
